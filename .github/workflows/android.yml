name: Android APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LUMINA_KEYSTORE_BASE64: ${{ secrets.LUMINA_KEYSTORE_BASE64 }}
      LUMINA_KEYSTORE_PASSWORD: ${{ secrets.LUMINA_KEYSTORE_PASSWORD }}
      LUMINA_KEY_ALIAS: ${{ secrets.LUMINA_KEY_ALIAS }}
      LUMINA_KEY_PASSWORD: ${{ secrets.LUMINA_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Çekirdek birim testleri
        run: ./gradlew --no-daemon :core:test

      - name: Yayın imzalama anahtarını hazırla (isteğe bağlı)
        if: env.LUMINA_KEYSTORE_BASE64 != ''
        run: |
          echo "$LUMINA_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "LUMINA_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: APK derle
        run: ./gradlew --no-daemon assembleRelease assembleDebug

      - name: APK dosyalarını adlandır
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p dist
          for f in app/build/outputs/apk/release/*.apk; do
            abi=$(basename "$f" .apk | sed -e 's/^app-//' -e 's/-release$//')
            cp "$f" "dist/LuminaPlayer-v${VERSION}-${abi}.apk"
          done
          cp app/build/outputs/apk/debug/app-universal-debug.apk "dist-debug.apk"
          ls -lh dist dist-debug.apk

      - name: APK'ları yükle (Actions → Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: LuminaPlayer-APK
          path: dist/*.apk
          retention-days: 30

      - name: Hata ayıklama APK'sını yükle
        uses: actions/upload-artifact@v4
        with:
          name: LuminaPlayer-debug-universal
          path: dist-debug.apk
          retention-days: 14

      - name: GitHub Release oluştur (v* etiketi)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
